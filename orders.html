<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusEats - Orders</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: #f8f9fa; color: #333; line-height: 1.6; padding-top: 70px; }
    nav { position: fixed; top: 0; width: 100%; background: #fff; display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 10; }
    .logo-img {
  height: 75px;
  
  width: 150px;
  border-radius: 8px; /* Smooth corners for square images */
  object-fit: cover;
  display: block;
}
    .nav-links a { color: #2c3e50; text-decoration: none; font-weight: bold; margin-left: 1.2rem; }
    .nav-links a:hover { color: #ff5722; }
    section { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    h2 { text-align: center; margin-bottom: 1.5rem; color: #2c3e50; border-bottom: 3px solid #ff5722; display: inline-block; }
    .sec-title { text-align: center; }
    .card { background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }
    .order-header { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 0.5rem; margin-bottom: 0.8rem; }
    .status { padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
    .status.preparing { background: #fff3cd; color: #856404; }
    .status.ready { background: #d4edda; color: #155724; }
    footer { background: #2c3e50; color: #fff; text-align: center; padding: 2rem 1rem; margin-top: 3rem; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html"><img src="CampusEats Steam.png" class="logo-img" alt="CampusEats Logo"></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="orders.html">Orders</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <section>
    <div class="sec-title"><h2>Recent Orders</h2></div>
    
    <div class="card">
      <div class="order-header">
        <strong>Order #CE-1042</strong>
        <span class="status preparing">Preparing ⏳</span>
      </div>
      <p><strong>Items:</strong> Veg Thali x 1, Cold Coffee x 1</p>
      <p><strong>Total:</strong> ₹170</p>
      <p><strong>Pickup Time:</strong> ~ 10 mins</p>
    </div>

    <div class="card">
      <div class="order-header">
        <strong>Order #CE-1020</strong>
        <span class="status ready">Ready for Pickup ✅</span>
      </div>
      <p><strong>Items:</strong> Paneer Roll x 2</p>
      <p><strong>Total:</strong> ₹160</p>
      <p><strong>Pickup Counter:</strong> Counter 2</p>
    </div>
  </section>

  <footer>
    <h3>Thank You</h3>
  </footer>

</body>
</html>
